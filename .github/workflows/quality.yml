name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze application code
        run: flutter analyze --no-pub
      - name: Run application tests
        run: dart tool/test.dart --no-pub --concurrency=2
      - name: Run proxy plugin tests
        run: flutter test --no-pub plugins/proxy/test

  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze application code
        run: flutter analyze --no-pub
      - name: Run application tests
        run: dart tool/test.dart --no-pub --concurrency=2
      - name: Run proxy plugin tests
        run: flutter test --no-pub plugins/proxy/test
      - name: Build Windows debug application
        run: dart tool/build.dart windows --debug --no-pub

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Run core tests
        run: CGO_ENABLED=0 go test ./...
